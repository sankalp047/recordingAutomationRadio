name: RadioQA
options:
  bundleIdPrefix: net.funasia
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"

targets:
  RadioQA:
    type: application
    platform: macOS
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
    sources:
      - path: RadioQA/Sources
      # XcodeGen has no top-level `resources:` key - a silently ignored one is
      # how the app icon failed to reach the bundle. Resources are sources with
      # an explicit build phase.
      - path: RadioQA/Resources
        buildPhase: resources
        optional: true
    info:
      path: RadioQA/Info.plist
      properties:
        CFBundleName: PM Radio Admin
        CFBundleDisplayName: PM Radio Admin
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        # The API is HTTPS, so no ATS exception is needed.
    entitlements:
      path: RadioQA/RadioQA.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.funasia.RadioQA
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
