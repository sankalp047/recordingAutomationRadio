name: RadioQA
options:
  bundleIdPrefix: net.funasia
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  RadioQA:
    type: application
    platform: macOS
    sources:
      - path: RadioQA/Sources
    resources:
      - path: RadioQA/Resources
        optional: true
    info:
      path: RadioQA/Info.plist
      properties:
        CFBundleName: PM Radio Logs
        CFBundleDisplayName: PM Radio Logs
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        # The API is HTTPS, so no ATS exception is needed.
    entitlements:
      path: RadioQA/RadioQA.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.funasia.RadioQA
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
