name = "show-archive-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Custom domain on the funasia.net zone. custom_domain = true makes Cloudflare
# create and manage the DNS record itself. Declaring a route also makes
# workers_dev default to false, so the API is reachable only here - no
# permanent account-wide workers.dev subdomain, and nothing on a hostname
# corporate DNS filters tend to block.
routes = [
  { pattern = "radio-api.funasia.net", custom_domain = true }
]

# Native R2 binding: the Worker reads the bucket directly, with no access keys
# and no egress charge.
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "show-archive"

[vars]
STATIONS = "sangam,funasia,vanakkam,apnapunjab"

# API_TOKEN is a secret, not a var:
#   npx wrangler secret put API_TOKEN
# If it is unset the API is open - fine for a first smoke test, not for real use.
